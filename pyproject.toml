[project]
name = "studiorelay"
version = "0.3.0"
description = "An OpenAI-compatible gateway that bridges Android Studio's AI agent with multiple LLM providers, handling API compatibility, request translation, streaming, and response normalization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StudioRelay contributors" }]

[project.scripts]
studiorelay = "studiorelay.cli:main"
kimibridge = "studiorelay.cli:main"
kimi-proxy = "studiorelay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studiorelay*", "kimibridge*"]
