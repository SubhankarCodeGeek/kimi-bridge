[project]
name = "kimibridge"
version = "0.1.0"
description = "Local OpenAI-compatible compatibility gateway for Kimi/Moonshot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KimiBridge contributors" }]

[project.scripts]
kimibridge = "kimibridge.cli:main"
kimi-proxy = "kimibridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
